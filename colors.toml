# Graphite — black glass, white type, a stainless edge.
# No hue is used as chrome. Red is only for a real alert.
mode = "dark"

accent = "#e7edf2"
selection = "#22262c"
selection_foreground = "#ffffff"
# Brushed steel, a step darker than the interface type so the icons are not white.
# A grey accent would otherwise fall back to blue.
icon_main = "#8fa0ad"
icon_main_end = "#c3cdd6"
icon_mark = "#d5dee6"
icon_paper = "#c9d3db"
# The orange icon role is steel too. Red stays the only hue, and only as a small mark.
icon_orange = "#a8b3bd"
muted = "#8b9198"

background = "#0c0d0f"
dark_background = "#08090a"
darker_background = "#050506"
lighter_background = "#181a1e"

foreground = "#f4f5f6"
dark_foreground = "#8e949b"
light_foreground = "#d5d8dc"
bright_foreground = "#ffffff"

hyprland_active_border = "rgba(e7edf2ee) rgba(ffffff99) 90deg"
hyprland_inactive_border = "rgba(ffffff22)"

red = "#e5484d"
bright_red = "#ff6b73"
# Red and silver, except the green slots, which are the Normandy SR-2 stripe.
# Nothing here is flame.
orange = "#c45c64"
yellow = "#c5ccd3"
bright_yellow = "#e6ebf0"

green = "#5271c7"
bright_green = "#91ace1"
cyan = "#c5ced6"
bright_cyan = "#e7edf2"
blue = "#aeb8c2"
bright_blue = "#d5dde4"
magenta = "#c4c6ca"
bright_magenta = "#e4e6e8"
brown = "#6a6e73"

# Code and diffs. The ANSI names above stay the terminal palette.
# The green slots there are the Normandy blue. Strings and success are this green.
syntax_comment = "#8e949b"
syntax_string = "#98c379"
syntax_keyword = "#c678dd"
syntax_function = "#91ace1"
syntax_type = "#e5c07b"
syntax_constant = "#e5484d"
syntax_number = "#d19a66"
syntax_property = "#56b6c2"
syntax_operator = "#e7edf2"
syntax_punctuation = "#8e949b"
syntax_variable = "#f4f5f6"
success = "#98c379"
warning = "#e5c07b"
info = "#91ace1"
error = "#e5484d"
